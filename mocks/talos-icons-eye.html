<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Talos — eye concepts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@900&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; overflow-x: clip; }
  body {
    background: oklch(95% 0.012 70);
    color: oklch(19% 0.012 40);
    font-family: "IBM Plex Mono", monospace;
    padding: 2rem;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 1.1rem;
    max-width: 1100px;
    margin-inline: auto;
  }
  @media (max-width: 700px) {
    .grid { grid-template-columns: 1fr; }
  }
  .card {
    background: oklch(98% 0.006 70);
    border: 1px solid oklch(80% 0.010 60);
    padding: 1.4rem;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    min-height: 185px;
    overflow: hidden;
  }
  .card__mark { flex: 1; display: flex; align-items: center; gap: 0.9rem; }
  .card__label {
    font-size: 0.64rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    opacity: 0.65;
    border-top: 1px solid oklch(80% 0.010 60);
    padding-top: 0.5rem;
    margin-top: 0.6rem;
  }
  .icon { flex: none; display: block; }
  .ink { stroke: oklch(19% 0.012 40); }
  .oxide { stroke: oklch(56% 0.17 45); }
  .oxide-fill { fill: oklch(56% 0.17 45); }
  .ink-fill { fill: oklch(19% 0.012 40); }
  .paper-fill { fill: oklch(98% 0.006 70); }

  .wm {
    font-family: "Big Shoulders Display", sans-serif;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: -0.03em;
    font-size: 1.9rem;
    color: oklch(19% 0.012 40);
  }
  .o-scan-wrap { position: relative; display: inline-block; clip-path: inset(0); }
  .o-scan-bar {
    position: absolute; left: -10%; right: -10%; height: 12%;
    background: oklch(56% 0.17 45 / 0.9);
    animation: scanY 2.4s cubic-bezier(0.65,0,0.35,1) infinite alternate;
  }
  @keyframes scanY { 0% { top: 4%; } 100% { top: 82%; } }

  .eye-scan-wrap { position: relative; display: inline-block; clip-path: inset(0); }
  .eye-scan-bar {
    position: absolute; left: -15%; right: -15%; height: 14%;
    background: oklch(56% 0.17 45 / 0.85);
    animation: scanYEye 2.2s cubic-bezier(0.65,0,0.35,1) infinite alternate;
  }
  @keyframes scanYEye { 0% { top: 8%; } 100% { top: 70%; } }
  @media (prefers-reduced-motion: reduce) { .o-scan-bar, .eye-scan-bar { animation-duration: 0.001ms; } }
</style>
</head>
<body>
  <div class="grid">

    <!-- 1. Cracked pupil -->
    <div class="card" id="e1">
      <div class="card__mark">
        <svg class="icon" width="46" height="26" viewBox="0 0 46 26" xmlns="http://www.w3.org/2000/svg">
          <path d="M2 13 C12 2 34 2 44 13 C34 24 12 24 2 13 Z" fill="none" class="ink" stroke-width="2"/>
          <circle cx="23" cy="13" r="6" class="ink-fill"/>
          <path d="M23 8 L21 13 L24 15 L20 18" fill="none" class="oxide" stroke-width="1.6"/>
        </svg>
        <div class="wm">TAL<span class="o-scan-wrap">O<span class="o-scan-bar"></span></span>S</div>
      </div>
      <div class="card__label">1 — Cracked pupil</div>
    </div>

    <!-- 2. Mechanical iris / aperture eye -->
    <div class="card" id="e2">
      <div class="card__mark">
        <svg class="icon" width="46" height="26" viewBox="0 0 46 26" xmlns="http://www.w3.org/2000/svg">
          <path d="M2 13 C12 2 34 2 44 13 C34 24 12 24 2 13 Z" fill="none" class="ink" stroke-width="2"/>
          <g class="oxide-fill">
            <path d="M23 7 L27 13 L23 13 Z" transform="rotate(0 23 13)"/>
            <path d="M23 7 L27 13 L23 13 Z" transform="rotate(60 23 13)"/>
            <path d="M23 7 L27 13 L23 13 Z" transform="rotate(120 23 13)"/>
            <path d="M23 7 L27 13 L23 13 Z" transform="rotate(180 23 13)"/>
            <path d="M23 7 L27 13 L23 13 Z" transform="rotate(240 23 13)"/>
            <path d="M23 7 L27 13 L23 13 Z" transform="rotate(300 23 13)"/>
          </g>
        </svg>
        <div class="wm">TAL<span class="o-scan-wrap">O<span class="o-scan-bar"></span></span>S</div>
      </div>
      <div class="card__label">2 — Mechanical iris (aperture eye)</div>
    </div>

    <!-- 3. Half-lid blink -->
    <div class="card" id="e3">
      <div class="card__mark">
        <svg class="icon" width="46" height="26" viewBox="0 0 46 26" xmlns="http://www.w3.org/2000/svg">
          <path d="M2 13 C12 2 34 2 44 13 C34 24 12 24 2 13 Z" fill="none" class="ink" stroke-width="2"/>
          <path d="M2 13 C12 6 34 6 44 13 L44 13 C34 8 12 8 2 13 Z" class="ink-fill" opacity="0.92"/>
          <circle cx="23" cy="16" r="4" class="oxide-fill" clip-path="inset(0)"/>
        </svg>
        <div class="wm">TAL<span class="o-scan-wrap">O<span class="o-scan-bar"></span></span>S</div>
      </div>
      <div class="card__label">3 — Half-lid (the moment it isn't watching)</div>
    </div>

    <!-- 4. Scan-line eye -->
    <div class="card" id="e4">
      <div class="card__mark">
        <svg class="icon" width="46" height="26" viewBox="0 0 46 26" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <clipPath id="eyeClip4"><path d="M2 13 C12 2 34 2 44 13 C34 24 12 24 2 13 Z"/></clipPath>
          </defs>
          <path d="M2 13 C12 2 34 2 44 13 C34 24 12 24 2 13 Z" fill="none" class="ink" stroke-width="2"/>
          <circle cx="23" cy="13" r="6" class="ink-fill"/>
          <g clip-path="url(#eyeClip4)">
            <rect x="0" y="10" width="46" height="3" class="oxide-fill" opacity="0.85"/>
          </g>
        </svg>
        <div class="wm">TAL<span class="o-scan-wrap">O<span class="o-scan-bar"></span></span>S</div>
      </div>
      <div class="card__label">4 — Scan-line eye (matches wordmark motif)</div>
    </div>

    <!-- 5. Blank, pupil-less (marble) stare -->
    <div class="card" id="e5">
      <div class="card__mark">
        <svg class="icon" width="46" height="26" viewBox="0 0 46 26" xmlns="http://www.w3.org/2000/svg">
          <path d="M2 13 C12 2 34 2 44 13 C34 24 12 24 2 13 Z" fill="none" class="ink" stroke-width="2"/>
          <circle cx="23" cy="13" r="4" fill="none" class="oxide" stroke-width="1.6"/>
        </svg>
        <div class="wm">TAL<span class="o-scan-wrap">O<span class="o-scan-bar"></span></span>S</div>
      </div>
      <div class="card__label">5 — Blank marble stare (no pupil)</div>
    </div>

  </div>
</body>
</html>
