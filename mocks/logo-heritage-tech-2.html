<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aegis — heritage-tech logo options, round 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@900&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; overflow-x: clip; }
  body {
    background: oklch(95% 0.012 70);
    color: oklch(19% 0.012 40);
    font-family: "IBM Plex Mono", monospace;
    padding: 2rem;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 1.25rem;
    max-width: 1100px;
    margin-inline: auto;
  }
  @media (max-width: 700px) {
    .grid { grid-template-columns: 1fr; }
  }
  .card {
    background: oklch(98% 0.006 70);
    border: 1px solid oklch(80% 0.010 60);
    padding: 1.5rem;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    min-height: 210px;
  }
  .card__mark {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 0.9rem;
  }
  .card__label {
    font-size: 0.66rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    opacity: 0.6;
    border-top: 1px solid oklch(80% 0.010 60);
    padding-top: 0.6rem;
    margin-top: 0.75rem;
  }
  .wordmark {
    position: relative;
    font-family: "Big Shoulders Display", sans-serif;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: -0.03em;
    font-size: 2rem;
  }
  .wordmark__back {
    position: absolute; top: 0; left: 0;
    color: oklch(87% 0.02 70 / 0.45);
    transform: translate(4px, 4px);
    z-index: 1;
  }
  .wordmark__front {
    position: relative;
    z-index: 2;
    color: oklch(19% 0.012 40);
  }
  .icon { flex: none; display: block; }
  .ink { stroke: oklch(19% 0.012 40); }
  .oxide { stroke: oklch(56% 0.17 45); }
</style>
</head>
<body>
  <div class="grid">

    <!-- 1. Viewfinder corners -->
    <div class="card" id="h1">
      <div class="card__mark">
        <svg class="icon" width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M2 12 V4 H10" class="ink" stroke-width="2.5"/>
          <path d="M30 4 H38 V12" class="ink" stroke-width="2.5"/>
          <path d="M38 28 V36 H30" class="ink" stroke-width="2.5"/>
          <path d="M10 36 H2 V28" class="ink" stroke-width="2.5"/>
          <circle cx="20" cy="20" r="6" class="oxide" stroke-width="2"/>
        </svg>
        <div class="wordmark">
          <span class="wordmark__back">AEGIS</span>
          <span class="wordmark__front">AEGIS</span>
        </div>
      </div>
      <div class="card__label">1 — Viewfinder corners</div>
    </div>

    <!-- 2. Duplicate / digital twin -->
    <div class="card" id="h2">
      <div class="card__mark">
        <svg class="icon" width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="4" y="4" width="22" height="22" class="ink" stroke-width="2.5"/>
          <rect x="14" y="14" width="22" height="22" class="oxide" stroke-width="2.5"/>
        </svg>
        <div class="wordmark">
          <span class="wordmark__back">AEGIS</span>
          <span class="wordmark__front">AEGIS</span>
        </div>
      </div>
      <div class="card__label">2 — Duplicate / digital twin</div>
    </div>

    <!-- 3. Aperture iris -->
    <div class="card" id="h3">
      <div class="card__mark">
        <svg class="icon" width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="20" cy="20" r="18" class="ink" stroke-width="1.4" opacity="0.4"/>
          <g class="oxide" stroke-width="2">
            <path d="M20 4 L26 16 L14 16 Z" transform="rotate(0 20 20)"/>
            <path d="M20 4 L26 16 L14 16 Z" transform="rotate(60 20 20)"/>
            <path d="M20 4 L26 16 L14 16 Z" transform="rotate(120 20 20)"/>
            <path d="M20 4 L26 16 L14 16 Z" transform="rotate(180 20 20)"/>
            <path d="M20 4 L26 16 L14 16 Z" transform="rotate(240 20 20)"/>
            <path d="M20 4 L26 16 L14 16 Z" transform="rotate(300 20 20)"/>
          </g>
        </svg>
        <div class="wordmark">
          <span class="wordmark__back">AEGIS</span>
          <span class="wordmark__front">AEGIS</span>
        </div>
      </div>
      <div class="card__label">3 — Aperture iris</div>
    </div>

    <!-- 4. Contour bust -->
    <div class="card" id="h4">
      <div class="card__mark">
        <svg class="icon" width="38" height="42" viewBox="0 0 38 42" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M19 2 C10 2 8 12 10 18 C4 22 3 34 3 40" class="ink" stroke-width="1.6" opacity="0.85"/>
          <path d="M19 6 C13 6 12 13 13 18 C8 22 7 34 7 40" class="oxide" stroke-width="1.6" opacity="0.9"/>
          <path d="M19 2 C28 2 30 12 28 18 C34 22 35 34 35 40" class="ink" stroke-width="1.6" opacity="0.85"/>
          <path d="M19 6 C25 6 26 13 25 18 C30 22 31 34 31 40" class="oxide" stroke-width="1.6" opacity="0.9"/>
        </svg>
        <div class="wordmark">
          <span class="wordmark__back">AEGIS</span>
          <span class="wordmark__front">AEGIS</span>
        </div>
      </div>
      <div class="card__label">4 — Contour bust</div>
    </div>

    <!-- 5. Dashed perimeter shield -->
    <div class="card" id="h5">
      <div class="card__mark">
        <svg class="icon" width="34" height="40" viewBox="0 0 34 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M17 2 L32 7 V19 C32 28 26 34 17 38 C8 34 2 28 2 19 V7 Z" class="ink" stroke-width="2" stroke-dasharray="4 3"/>
          <path d="M17 10 L17 30 M10 20 H24" class="oxide" stroke-width="1.6"/>
        </svg>
        <div class="wordmark">
          <span class="wordmark__back">AEGIS</span>
          <span class="wordmark__front">AEGIS</span>
        </div>
      </div>
      <div class="card__label">5 — Dashed perimeter shield</div>
    </div>

  </div>
</body>
</html>
