<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aegis — background color grades</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@900&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; overflow-x: clip; }
  body {
    background: oklch(95% 0.012 70);
    color: oklch(19% 0.012 40);
    font-family: "IBM Plex Mono", monospace;
    padding: 2rem;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 1.25rem;
    max-width: 1100px;
    margin-inline: auto;
  }
  @media (max-width: 700px) {
    .grid { grid-template-columns: 1fr; }
  }
  .card {
    background: oklch(98% 0.006 70);
    border: 1px solid oklch(80% 0.010 60);
    overflow: hidden;
  }
  .frame {
    position: relative;
    aspect-ratio: 4 / 3;
    overflow: hidden;
  }
  .frame img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 60% 40%;
  }
  .wordmark {
    position: absolute;
    top: 10px; left: 12px;
    font-family: "Big Shoulders Display", sans-serif;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: -0.03em;
    font-size: 1rem;
    z-index: 2;
  }
  .wordmark__back {
    position: absolute; top: 0; left: 0;
    color: oklch(56% 0.17 45);
    transform: translate(2px, 2px);
    z-index: 1;
  }
  .card__label {
    font-size: 0.66rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    opacity: 0.65;
    padding: 0.6rem 0.9rem;
  }

  #g1 img { filter: none; }
  #g2 img { filter: sepia(0.45) saturate(1.6) hue-rotate(-14deg) contrast(1.1) brightness(0.98); }
  #g3 img { filter: grayscale(0.35) hue-rotate(200deg) saturate(1.3) contrast(1.05); }
  #g4 img { filter: grayscale(1) contrast(1.35) brightness(1.05); }
  #g5 img { filter: grayscale(0.55) brightness(1.18) contrast(0.9); }
  #g6 img { filter: contrast(1.25) brightness(0.8) saturate(0.55) hue-rotate(190deg); }
</style>
</head>
<body>
  <div class="grid">

    <div class="card" id="g1">
      <div class="frame">
        <img src="../assets/background.jpg" alt="">
        <span class="wordmark"><span class="wordmark__back">AEGIS</span><span class="wordmark__front" style="color:oklch(97% 0.006 70)">AEGIS</span></span>
      </div>
      <div class="card__label">1 — Natural (current, cool storm)</div>
    </div>

    <div class="card" id="g2">
      <div class="frame">
        <img src="../assets/background.jpg" alt="">
        <span class="wordmark"><span class="wordmark__back">AEGIS</span><span class="wordmark__front" style="color:oklch(97% 0.01 70)">AEGIS</span></span>
      </div>
      <div class="card__label">2 — Warm oxide grade (matches accent)</div>
    </div>

    <div class="card" id="g3">
      <div class="frame">
        <img src="../assets/background.jpg" alt="">
        <span class="wordmark"><span class="wordmark__back">AEGIS</span><span class="wordmark__front" style="color:oklch(97% 0.006 250)">AEGIS</span></span>
      </div>
      <div class="card__label">3 — Cool steel (earlier direction)</div>
    </div>

    <div class="card" id="g4">
      <div class="frame">
        <img src="../assets/background.jpg" alt="">
        <span class="wordmark"><span class="wordmark__back">AEGIS</span><span class="wordmark__front" style="color:#fff">AEGIS</span></span>
      </div>
      <div class="card__label">4 — High-contrast monochrome</div>
    </div>

    <div class="card" id="g5">
      <div class="frame">
        <img src="../assets/background.jpg" alt="">
        <span class="wordmark"><span class="wordmark__back">AEGIS</span><span class="wordmark__front" style="color:#2a2a2a">AEGIS</span></span>
      </div>
      <div class="card__label">5 — Bleached / desaturated</div>
    </div>

    <div class="card" id="g6">
      <div class="frame">
        <img src="../assets/background.jpg" alt="">
        <span class="wordmark"><span class="wordmark__back">AEGIS</span><span class="wordmark__front" style="color:oklch(97% 0.006 250)">AEGIS</span></span>
      </div>
      <div class="card__label">6 — Deep ink duotone</div>
    </div>

  </div>
</body>
</html>
