<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aegis — square lockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; overflow-x: clip; }
  body {
    background: oklch(95% 0.012 70);
    color: oklch(19% 0.012 40);
    font-family: "IBM Plex Mono", monospace;
    padding: 3rem;
    display: flex;
    gap: 3rem;
    flex-wrap: wrap;
    align-items: flex-start;
  }
  .panel {
    display: flex;
    flex-direction: column;
    gap: 0.9rem;
  }
  .panel__label {
    font-size: 0.68rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    opacity: 0.6;
  }

  .square {
    width: 240px;
    height: 240px;
    background: oklch(98% 0.006 70);
    border: 1px solid oklch(80% 0.010 60);
    position: relative;
  }
  .square--guide {
    outline: 1px dashed oklch(60% 0.010 60);
    outline-offset: -1px;
  }

  .lockup {
    position: absolute;
    inset: 20px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .wm-line {
    font-family: "Big Shoulders Display", sans-serif;
    text-transform: uppercase;
    white-space: nowrap;
    display: block;
  }
  .wm-line--top {
    font-weight: 900;
    font-size: 6.4rem;
    line-height: 0.78;
    color: oklch(19% 0.012 40);
  }
  .wm-line--bottom {
    font-weight: 700;
    font-size: 3.1rem;
    line-height: 0.82;
    color: oklch(56% 0.17 45);
  }
</style>
</head>
<body>

  <div class="panel">
    <div class="square square--guide">
      <div class="lockup">
        <span class="wm-line wm-line--top" id="lineTop">AE</span>
        <span class="wm-line wm-line--bottom" id="lineBottom">GIS</span>
      </div>
    </div>
    <div class="panel__label">With square guide (dashed) — both lines forced to the same width, block fills the frame</div>
  </div>

  <div class="panel">
    <div class="square">
      <div class="lockup">
        <span class="wm-line wm-line--top">AE</span>
        <span class="wm-line wm-line--bottom">GIS</span>
      </div>
    </div>
    <div class="panel__label">Clean — same lockup, guide hidden</div>
  </div>

  <script>
    // Equalize the two lines to the same rendered width via letter-spacing
    // (not scaleX — keeps each letterform's proportions honest, only the
    // inter-letter gaps move) so AE and GIS occupy identical width while
    // keeping their own distinct sizes/weights.
    function equalizeWidth(topEl, bottomEl) {
      topEl.style.letterSpacing = '0px';
      bottomEl.style.letterSpacing = '0px';
      const targetWidth = topEl.getBoundingClientRect().width;
      const bottomText = bottomEl.textContent;
      const naturalWidth = bottomEl.getBoundingClientRect().width;
      const gaps = bottomText.length - 1;
      const extra = (targetWidth - naturalWidth) / gaps;
      bottomEl.style.letterSpacing = extra + 'px';
    }

    document.querySelectorAll('.square').forEach((sq) => {
      const top = sq.querySelector('.wm-line--top');
      const bottom = sq.querySelector('.wm-line--bottom');
      equalizeWidth(top, bottom);
    });
  </script>
</body>
</html>
