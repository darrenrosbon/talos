<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Talos — icon concepts, round 4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@900&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; overflow-x: clip; }
  body {
    background: oklch(95% 0.012 70);
    color: oklch(19% 0.012 40);
    font-family: "IBM Plex Mono", monospace;
    padding: 2rem;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 1.1rem;
    max-width: 1100px;
    margin-inline: auto;
  }
  @media (max-width: 700px) {
    .grid { grid-template-columns: 1fr; }
  }
  .card {
    background: oklch(98% 0.006 70);
    border: 1px solid oklch(80% 0.010 60);
    padding: 1.4rem;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    min-height: 185px;
  }
  .card__mark { flex: 1; display: flex; align-items: center; gap: 0.9rem; }
  .card__label {
    font-size: 0.64rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    opacity: 0.65;
    border-top: 1px solid oklch(80% 0.010 60);
    padding-top: 0.5rem;
    margin-top: 0.6rem;
  }
  .icon { flex: none; display: block; }
  .ink { stroke: oklch(19% 0.012 40); }
  .oxide { stroke: oklch(56% 0.17 45); }
  .oxide-fill { fill: oklch(56% 0.17 45); }
  .ink-fill { fill: oklch(19% 0.012 40); }
  .paper-fill { fill: oklch(98% 0.006 70); }

  .wm {
    font-family: "Big Shoulders Display", sans-serif;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: -0.03em;
    font-size: 1.9rem;
    color: oklch(19% 0.012 40);
  }
  .o-scan-wrap { position: relative; display: inline-block; clip-path: inset(0); }
  .o-scan-bar {
    position: absolute; left: -10%; right: -10%; height: 12%;
    background: oklch(56% 0.17 45 / 0.9);
    animation: scanY 2.4s cubic-bezier(0.65,0,0.35,1) infinite alternate;
  }
  @keyframes scanY { 0% { top: 4%; } 100% { top: 82%; } }
  @media (prefers-reduced-motion: reduce) { .o-scan-bar { animation-duration: 0.001ms; } }
</style>
</head>
<body>
  <div class="grid">

    <!-- 1. Cracked disk -->
    <div class="card" id="t1">
      <div class="card__mark">
        <svg class="icon" width="36" height="36" viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg">
          <circle cx="18" cy="18" r="16" class="ink-fill"/>
          <path d="M18 2 L15 14 L20 17 L14 22 L18 34" fill="none" class="oxide" stroke-width="2"/>
        </svg>
        <div class="wm">TAL<span class="o-scan-wrap">O<span class="o-scan-bar"></span></span>S</div>
      </div>
      <div class="card__label">1 — Cracked disk</div>
    </div>

    <!-- 2. Three ticks, one different -->
    <div class="card" id="t2">
      <div class="card__mark">
        <svg class="icon" width="36" height="32" viewBox="0 0 36 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <line x1="4" y1="14" x2="4" y2="28" class="ink" stroke-width="3" stroke-linecap="round"/>
          <line x1="16" y1="14" x2="16" y2="28" class="ink" stroke-width="3" stroke-linecap="round"/>
          <line x1="28" y1="4" x2="28" y2="28" class="oxide" stroke-width="3" stroke-linecap="round"/>
        </svg>
        <div class="wm">TAL<span class="o-scan-wrap">O<span class="o-scan-bar"></span></span>S</div>
      </div>
      <div class="card__label">2 — Three ticks, one different</div>
    </div>

    <!-- 3. Fingerprint fragment -->
    <div class="card" id="t3">
      <div class="card__mark">
        <svg class="icon" width="36" height="36" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M18 3 A15 15 0 1 1 3 18" class="ink" stroke-width="2"/>
          <path d="M18 9 A9 9 0 1 1 9 18" class="ink" stroke-width="2"/>
          <path d="M18 15 A3 3 0 1 1 15.2 19.5" class="oxide" stroke-width="2"/>
        </svg>
        <div class="wm">TAL<span class="o-scan-wrap">O<span class="o-scan-bar"></span></span>S</div>
      </div>
      <div class="card__label">3 — Fingerprint fragment</div>
    </div>

    <!-- 4. Compass, single bearing -->
    <div class="card" id="t4">
      <div class="card__mark">
        <svg class="icon" width="38" height="38" viewBox="0 0 38 38" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="19" cy="19" r="16" class="ink" stroke-width="2"/>
          <line x1="19" y1="5" x2="19" y2="9" class="ink" stroke-width="2"/>
          <line x1="19" y1="29" x2="19" y2="33" class="ink" stroke-width="2"/>
          <line x1="5" y1="19" x2="9" y2="19" class="ink" stroke-width="2"/>
          <line x1="19" y1="19" x2="31" y2="11" class="oxide" stroke-width="2.4" stroke-linecap="round"/>
          <circle cx="19" cy="19" r="1.8" class="ink-fill"/>
        </svg>
        <div class="wm">TAL<span class="o-scan-wrap">O<span class="o-scan-bar"></span></span>S</div>
      </div>
      <div class="card__label">4 — Compass, single bearing</div>
    </div>

    <!-- 5. Suture / sealed seam -->
    <div class="card" id="t5">
      <div class="card__mark">
        <svg class="icon" width="46" height="20" viewBox="0 0 46 20" fill="none" xmlns="http://www.w3.org/2000/svg">
          <line x1="2" y1="10" x2="44" y2="10" class="ink" stroke-width="1.6" stroke-dasharray="1 4" stroke-linecap="round"/>
          <line x1="23" y1="3" x2="23" y2="17" class="oxide" stroke-width="2.4" stroke-linecap="round"/>
        </svg>
        <div class="wm">TAL<span class="o-scan-wrap">O<span class="o-scan-bar"></span></span>S</div>
      </div>
      <div class="card__label">5 — Sealed seam (suture)</div>
    </div>

  </div>
</body>
</html>
