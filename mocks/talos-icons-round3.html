<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Talos — icon concepts, round 3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@900&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; overflow-x: clip; }
  body {
    background: oklch(95% 0.012 70);
    color: oklch(19% 0.012 40);
    font-family: "IBM Plex Mono", monospace;
    padding: 2rem;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 1.1rem;
    max-width: 1100px;
    margin-inline: auto;
  }
  @media (max-width: 700px) {
    .grid { grid-template-columns: 1fr; }
  }
  .card {
    background: oklch(98% 0.006 70);
    border: 1px solid oklch(80% 0.010 60);
    padding: 1.4rem;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    min-height: 185px;
  }
  .card__mark { flex: 1; display: flex; align-items: center; gap: 0.9rem; }
  .card__label {
    font-size: 0.64rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    opacity: 0.65;
    border-top: 1px solid oklch(80% 0.010 60);
    padding-top: 0.5rem;
    margin-top: 0.6rem;
  }
  .icon { flex: none; display: block; }
  .ink { stroke: oklch(19% 0.012 40); }
  .oxide { stroke: oklch(56% 0.17 45); }
  .oxide-fill { fill: oklch(56% 0.17 45); }
  .ink-fill { fill: oklch(19% 0.012 40); }

  .wm {
    font-family: "Big Shoulders Display", sans-serif;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: -0.03em;
    font-size: 1.9rem;
    color: oklch(19% 0.012 40);
  }
  .o-scan-wrap { position: relative; display: inline-block; clip-path: inset(0); }
  .o-scan-bar {
    position: absolute; left: -10%; right: -10%; height: 12%;
    background: oklch(56% 0.17 45 / 0.9);
    animation: scanY 2.4s cubic-bezier(0.65,0,0.35,1) infinite alternate;
  }
  @keyframes scanY { 0% { top: 4%; } 100% { top: 82%; } }
  @media (prefers-reduced-motion: reduce) { .o-scan-bar { animation-duration: 0.001ms; } }
</style>
</head>
<body>
  <div class="grid">

    <!-- 1. Weakest link -->
    <div class="card" id="s1">
      <div class="card__mark">
        <svg class="icon" width="46" height="26" viewBox="0 0 46 26" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="1" y="7" width="16" height="12" rx="6" class="ink" stroke-width="2.4"/>
          <rect x="29" y="7" width="16" height="12" rx="6" class="ink" stroke-width="2.4"/>
          <rect x="15" y="6" width="16" height="14" rx="6.5" class="oxide" stroke-width="2.4" stroke-dasharray="5 4"/>
        </svg>
        <div class="wm">TAL<span class="o-scan-wrap">O<span class="o-scan-bar"></span></span>S</div>
      </div>
      <div class="card__label">1 — Weakest link (broken chain)</div>
    </div>

    <!-- 2. Ring with one clean gap -->
    <div class="card" id="s2">
      <div class="card__mark">
        <svg class="icon" width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M28 6 A16 16 0 1 1 12 6" class="ink" stroke-width="2.6" stroke-linecap="round"/>
          <circle cx="20" cy="3.2" r="2.6" class="oxide-fill"/>
        </svg>
        <div class="wm">TAL<span class="o-scan-wrap">O<span class="o-scan-bar"></span></span>S</div>
      </div>
      <div class="card__label">2 — Ring, one clean gap</div>
    </div>

    <!-- 3. Lighthouse beam -->
    <div class="card" id="s3">
      <div class="card__mark">
        <svg class="icon" width="44" height="36" viewBox="0 0 44 36" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M8 34 L14 10 H18 L24 34" class="ink" stroke-width="2" stroke-linejoin="round"/>
          <path d="M18 14 L42 6 M18 18 L42 18" class="oxide" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
        <div class="wm">TAL<span class="o-scan-wrap">O<span class="o-scan-bar"></span></span>S</div>
      </div>
      <div class="card__label">3 — Lighthouse beam</div>
    </div>

    <!-- 4. Rivet through plate -->
    <div class="card" id="s4">
      <div class="card__mark">
        <svg class="icon" width="42" height="30" viewBox="0 0 42 30" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="1" y="10" width="40" height="10" class="ink" stroke-width="2"/>
          <circle cx="21" cy="15" r="4.5" class="oxide-fill"/>
          <circle cx="21" cy="15" r="4.5" class="ink" stroke-width="1"/>
        </svg>
        <div class="wm">TAL<span class="o-scan-wrap">O<span class="o-scan-bar"></span></span>S</div>
      </div>
      <div class="card__label">4 — Rivet through plate</div>
    </div>

    <!-- 5. Reticle -->
    <div class="card" id="s5">
      <div class="card__mark">
        <svg class="icon" width="38" height="38" viewBox="0 0 38 38" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M2 12 V2 H12 M26 2 H36 V12 M36 26 V36 H26 M12 36 H2 V26" class="ink" stroke-width="2.4"/>
          <circle cx="19" cy="19" r="2.6" class="oxide-fill"/>
        </svg>
        <div class="wm">TAL<span class="o-scan-wrap">O<span class="o-scan-bar"></span></span>S</div>
      </div>
      <div class="card__label">5 — Reticle, single mark</div>
    </div>

  </div>
</body>
</html>
