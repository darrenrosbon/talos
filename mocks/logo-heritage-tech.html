<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aegis — heritage-tech logo options</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@900&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; overflow-x: clip; }
  body {
    background: oklch(95% 0.012 70);
    color: oklch(19% 0.012 40);
    font-family: "IBM Plex Mono", monospace;
    padding: 2rem;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 1.25rem;
    max-width: 1100px;
    margin-inline: auto;
  }
  @media (max-width: 700px) {
    .grid { grid-template-columns: 1fr; }
  }
  .card {
    background: oklch(98% 0.006 70);
    border: 1px solid oklch(80% 0.010 60);
    padding: 1.5rem;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    min-height: 210px;
  }
  .card__mark {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 0.9rem;
  }
  .card__label {
    font-size: 0.66rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    opacity: 0.6;
    border-top: 1px solid oklch(80% 0.010 60);
    padding-top: 0.6rem;
    margin-top: 0.75rem;
  }
  .wordmark {
    position: relative;
    font-family: "Big Shoulders Display", sans-serif;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: -0.03em;
    font-size: 2rem;
  }
  .wordmark__back {
    position: absolute; top: 0; left: 0;
    color: oklch(87% 0.02 70 / 0.45);
    transform: translate(4px, 4px);
    z-index: 1;
  }
  .wordmark__front {
    position: relative;
    z-index: 2;
    color: oklch(19% 0.012 40);
  }
  .icon { flex: none; display: block; }
  .ink { stroke: oklch(19% 0.012 40); }
  .oxide { stroke: oklch(56% 0.17 45); }
  .oxide-fill { fill: oklch(56% 0.17 45); }
  .ink-fill { fill: oklch(19% 0.012 40); }
</style>
</head>
<body>
  <div class="grid">

    <!-- 1. Scan-line pass -->
    <div class="card" id="l1">
      <div class="card__mark">
        <svg class="icon" width="42" height="42" viewBox="0 0 42 42" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M8 6 L4 12 L4 30 L8 36 M34 6 L38 12 L38 30 L34 36" class="ink" stroke-width="2"/>
          <path d="M14 12 Q21 8 28 12 Q31 21 28 30 Q21 34 14 30 Q11 21 14 12 Z" class="ink" stroke-width="1.4" opacity="0.55"/>
          <line x1="6" y1="14" x2="36" y2="14" class="oxide" stroke-width="2"/>
          <line x1="6" y1="21" x2="36" y2="21" class="oxide" stroke-width="2" opacity="0.6"/>
          <line x1="6" y1="28" x2="36" y2="28" class="oxide" stroke-width="2"/>
        </svg>
        <div class="wordmark">
          <span class="wordmark__back">AEGIS</span>
          <span class="wordmark__front">AEGIS</span>
        </div>
      </div>
      <div class="card__label">1 — Scan-line pass</div>
    </div>

    <!-- 2. Fracture + grid reassembly -->
    <div class="card" id="l2">
      <div class="card__mark">
        <svg class="icon" width="42" height="42" viewBox="0 0 42 42" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 4 C8 10 8 16 12 20 L10 38 M12 20 L18 38" class="ink" stroke-width="2" stroke-linecap="round"/>
          <path d="M8 6 L14 12 M6 14 L13 15 M8 24 L14 21" class="oxide" stroke-width="1.6"/>
          <rect x="24" y="6" width="12" height="12" class="ink" stroke-width="1.2" opacity="0.5"/>
          <rect x="24" y="20" width="12" height="12" class="oxide" stroke-width="1.2" opacity="0.8"/>
        </svg>
        <div class="wordmark">
          <span class="wordmark__back">AEGIS</span>
          <span class="wordmark__front">AEGIS</span>
        </div>
      </div>
      <div class="card__label">2 — Fracture &amp; grid reassembly</div>
    </div>

    <!-- 3. Point-cloud bust -->
    <div class="card" id="l3">
      <div class="card__mark">
        <svg class="icon" width="40" height="42" viewBox="0 0 40 42" xmlns="http://www.w3.org/2000/svg">
          <g class="ink-fill">
            <circle cx="20" cy="8" r="1.4"/><circle cx="15" cy="10" r="1.4"/><circle cx="25" cy="10" r="1.4"/>
            <circle cx="12" cy="15" r="1.4"/><circle cx="20" cy="14" r="1.4"/><circle cx="28" cy="15" r="1.4"/>
            <circle cx="10" cy="21" r="1.4"/><circle cx="16" cy="20" r="1.4"/><circle cx="24" cy="20" r="1.4"/><circle cx="30" cy="21" r="1.4"/>
          </g>
          <g class="oxide-fill">
            <circle cx="8" cy="28" r="1.4"/><circle cx="14" cy="27" r="1.4"/><circle cx="20" cy="27" r="1.4"/><circle cx="26" cy="27" r="1.4"/><circle cx="32" cy="28" r="1.4"/>
            <circle cx="6" cy="36" r="1.4"/><circle cx="14" cy="35" r="1.4"/><circle cx="20" cy="34" r="1.4"/><circle cx="26" cy="35" r="1.4"/><circle cx="34" cy="36" r="1.4"/>
          </g>
        </svg>
        <div class="wordmark">
          <span class="wordmark__back">AEGIS</span>
          <span class="wordmark__front">AEGIS</span>
        </div>
      </div>
      <div class="card__label">3 — Point-cloud bust</div>
    </div>

    <!-- 4. Shield with mesh grid -->
    <div class="card" id="l4">
      <div class="card__mark">
        <svg class="icon" width="36" height="42" viewBox="0 0 36 42" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M18 2 L34 8 V20 C34 30 27 37 18 40 C9 37 2 30 2 20 V8 Z" class="ink" stroke-width="2"/>
          <line x1="2" y1="14" x2="34" y2="14" class="oxide" stroke-width="1.2" opacity="0.8"/>
          <line x1="2" y1="22" x2="34" y2="22" class="oxide" stroke-width="1.2" opacity="0.8"/>
          <line x1="2" y1="30" x2="30" y2="30" class="oxide" stroke-width="1.2" opacity="0.6"/>
          <line x1="12" y1="4" x2="12" y2="38" class="oxide" stroke-width="1.2" opacity="0.5"/>
          <line x1="24" y1="4" x2="24" y2="37" class="oxide" stroke-width="1.2" opacity="0.5"/>
        </svg>
        <div class="wordmark">
          <span class="wordmark__back">AEGIS</span>
          <span class="wordmark__front">AEGIS</span>
        </div>
      </div>
      <div class="card__label">4 — Shield with mesh grid</div>
    </div>

    <!-- 5. Archive layers -->
    <div class="card" id="l5">
      <div class="card__mark">
        <svg class="icon" width="42" height="34" viewBox="0 0 42 34" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="2" y="2" width="38" height="8" class="ink" stroke-width="2"/>
          <rect x="6" y="13" width="30" height="8" class="ink" stroke-width="2" opacity="0.7"/>
          <rect x="10" y="24" width="22" height="8" class="oxide" stroke-width="2"/>
        </svg>
        <div class="wordmark">
          <span class="wordmark__back">AEGIS</span>
          <span class="wordmark__front">AEGIS</span>
        </div>
      </div>
      <div class="card__label">5 — Archive layers</div>
    </div>

  </div>
</body>
</html>
