<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aegis — icon &amp; wordmark combos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; overflow-x: clip; }
  body {
    background: oklch(95% 0.012 70);
    color: oklch(19% 0.012 40);
    font-family: "IBM Plex Mono", monospace;
    padding: 2rem;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 1.25rem;
    max-width: 1100px;
    margin-inline: auto;
  }
  @media (max-width: 700px) {
    .grid { grid-template-columns: 1fr; }
  }
  .card {
    background: oklch(98% 0.006 70);
    border: 1px solid oklch(80% 0.010 60);
    padding: 1.5rem;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    min-height: 210px;
  }
  .card__mark {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 0.85rem;
  }
  .card__label {
    font-size: 0.68rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    opacity: 0.6;
    border-top: 1px solid oklch(80% 0.010 60);
    padding-top: 0.6rem;
    margin-top: 0.75rem;
  }
  .wordmark {
    font-family: "Big Shoulders Display", sans-serif;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: -0.03em;
    font-size: 2.3rem;
    color: oklch(19% 0.012 40);
  }
  .icon { flex: none; display: block; }
  .ink { stroke: oklch(19% 0.012 40); }
  .oxide-fill { fill: oklch(56% 0.17 45); }
  .oxide-stroke { stroke: oklch(56% 0.17 45); }
</style>
</head>
<body>
  <div class="grid">

    <!-- 1. Site crosshair marker -->
    <div class="card" id="c1">
      <div class="card__mark">
        <svg class="icon" width="42" height="42" viewBox="0 0 42 42" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="21" cy="21" r="14" class="ink" stroke-width="2"/>
          <line x1="21" y1="1" x2="21" y2="11" class="oxide-stroke" stroke-width="2"/>
          <line x1="21" y1="31" x2="21" y2="41" class="oxide-stroke" stroke-width="2"/>
          <line x1="1" y1="21" x2="11" y2="21" class="oxide-stroke" stroke-width="2"/>
          <line x1="31" y1="21" x2="41" y2="21" class="oxide-stroke" stroke-width="2"/>
        </svg>
        <div class="wordmark">AEGIS</div>
      </div>
      <div class="card__label">1 — Site crosshair marker</div>
    </div>

    <!-- 2. Roofline / gable triangle -->
    <div class="card" id="c2">
      <div class="card__mark">
        <svg class="icon" width="42" height="38" viewBox="0 0 42 38" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M2 34 L21 3 L40 34" class="ink" stroke-width="3" stroke-linejoin="round"/>
          <line x1="21" y1="3" x2="21" y2="20" class="oxide-stroke" stroke-width="3"/>
        </svg>
        <div class="wordmark">AEGIS</div>
      </div>
      <div class="card__label">2 — Roofline mark</div>
    </div>

    <!-- 3. Structural grid / module -->
    <div class="card" id="c3">
      <div class="card__mark">
        <svg class="icon" width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="1" y="1" width="17" height="17" class="ink" stroke-width="2"/>
          <rect x="22" y="1" width="17" height="17" class="ink" stroke-width="2"/>
          <rect x="1" y="22" width="17" height="17" class="ink" stroke-width="2"/>
          <rect x="22" y="22" width="17" height="17" class="oxide-fill" stroke="none"/>
        </svg>
        <div class="wordmark">AEGIS</div>
      </div>
      <div class="card__label">3 — Structural module grid</div>
    </div>

    <!-- 4. North arrow / orientation mark -->
    <div class="card" id="c4">
      <div class="card__mark">
        <svg class="icon" width="34" height="42" viewBox="0 0 34 42" fill="none" xmlns="http://www.w3.org/2000/svg">
          <line x1="17" y1="2" x2="17" y2="40" class="ink" stroke-width="2"/>
          <polygon points="17,2 24,18 17,14 10,18" class="oxide-fill"/>
        </svg>
        <div class="wordmark">AEGIS</div>
      </div>
      <div class="card__label">4 — North / orientation arrow</div>
    </div>

    <!-- 5. Plumb line / level -->
    <div class="card" id="c5">
      <div class="card__mark">
        <svg class="icon" width="26" height="42" viewBox="0 0 26 42" fill="none" xmlns="http://www.w3.org/2000/svg">
          <line x1="13" y1="0" x2="13" y2="32" class="ink" stroke-width="2"/>
          <line x1="2" y1="8" x2="24" y2="8" class="ink" stroke-width="2"/>
          <circle cx="13" cy="37" r="5" class="oxide-fill"/>
        </svg>
        <div class="wordmark">AEGIS</div>
      </div>
      <div class="card__label">5 — Plumb line &amp; level</div>
    </div>

  </div>
</body>
</html>
