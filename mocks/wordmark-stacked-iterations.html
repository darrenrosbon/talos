<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aegis — stacked lockup iterations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; overflow-x: clip; }
  body {
    background: oklch(95% 0.012 70);
    color: oklch(19% 0.012 40);
    font-family: "IBM Plex Mono", monospace;
    padding: 2rem;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 1.25rem;
    max-width: 1100px;
    margin-inline: auto;
  }
  @media (max-width: 700px) {
    .grid { grid-template-columns: 1fr; }
  }
  .card {
    background: oklch(98% 0.006 70);
    border: 1px solid oklch(80% 0.010 60);
    padding: 1.5rem;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    min-height: 210px;
  }
  .card__mark {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .card__label {
    font-size: 0.68rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    opacity: 0.6;
    border-top: 1px solid oklch(80% 0.010 60);
    padding-top: 0.6rem;
    margin-top: 0.75rem;
  }
  .ink { color: oklch(19% 0.012 40); }
  .oxide { color: oklch(56% 0.17 45); }
  .wm-line {
    font-family: "Big Shoulders Display", sans-serif;
    text-transform: uppercase;
    line-height: 0.82;
    letter-spacing: -0.02em;
  }

  /* 1. Baseline — AE / GIS, oxide bottom, left */
  #s1 .top { font-size: 2.4rem; font-weight: 900; }
  #s1 .bottom { font-size: 1.5rem; font-weight: 700; }

  /* 2. Split A / EGIS — dramatic single-letter top */
  #s2 .top { font-size: 3.4rem; font-weight: 900; }
  #s2 .bottom { font-size: 1.3rem; font-weight: 700; margin-top: 0.15em; }

  /* 3. Reversed hierarchy — oxide leads on top, ink below */
  #s3 .top { font-size: 2.4rem; font-weight: 900; }
  #s3 .bottom { font-size: 1.5rem; font-weight: 700; }

  /* 4. Rule-divided, right-aligned block */
  #s4 .card__mark { align-items: flex-end; }
  #s4 .top { font-size: 2.2rem; font-weight: 900; }
  #s4 .divider { width: 100%; height: 3px; background: oklch(19% 0.012 40); margin-block: 0.35em; }
  #s4 .bottom { font-size: 1.3rem; font-weight: 700; }

  /* 5. Monochrome, size-only hierarchy, no accent */
  #s5 .top { font-size: 2.4rem; font-weight: 900; }
  #s5 .bottom { font-size: 1.5rem; font-weight: 500; }
</style>
</head>
<body>
  <div class="grid">

    <div class="card" id="s1">
      <div class="card__mark">
        <div class="wm-line top ink">AE</div>
        <div class="wm-line bottom oxide">GIS</div>
      </div>
      <div class="card__label">1 — Baseline: AE / GIS, oxide bottom</div>
    </div>

    <div class="card" id="s2">
      <div class="card__mark">
        <div class="wm-line top ink">A</div>
        <div class="wm-line bottom oxide">EGIS</div>
      </div>
      <div class="card__label">2 — Split A / EGIS, dominant initial</div>
    </div>

    <div class="card" id="s3">
      <div class="card__mark">
        <div class="wm-line top oxide">AE</div>
        <div class="wm-line bottom ink">GIS</div>
      </div>
      <div class="card__label">3 — Reversed: oxide leads</div>
    </div>

    <div class="card" id="s4">
      <div class="card__mark">
        <div class="wm-line top ink">AE</div>
        <div class="divider"></div>
        <div class="wm-line bottom ink">GIS</div>
      </div>
      <div class="card__label">4 — Rule-divided, right-aligned</div>
    </div>

    <div class="card" id="s5">
      <div class="card__mark">
        <div class="wm-line top ink">AE</div>
        <div class="wm-line bottom ink">GIS</div>
      </div>
      <div class="card__label">5 — Monochrome, size-only</div>
    </div>

  </div>
</body>
</html>
