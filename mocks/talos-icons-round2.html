<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Talos — icon concepts, round 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@900&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; overflow-x: clip; }
  body {
    background: oklch(95% 0.012 70);
    color: oklch(19% 0.012 40);
    font-family: "IBM Plex Mono", monospace;
    padding: 2rem;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 1.1rem;
    max-width: 1100px;
    margin-inline: auto;
  }
  @media (max-width: 700px) {
    .grid { grid-template-columns: 1fr; }
  }
  .card {
    background: oklch(98% 0.006 70);
    border: 1px solid oklch(80% 0.010 60);
    padding: 1.4rem;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    min-height: 185px;
  }
  .card__mark { flex: 1; display: flex; align-items: center; gap: 0.9rem; }
  .card__label {
    font-size: 0.64rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    opacity: 0.65;
    border-top: 1px solid oklch(80% 0.010 60);
    padding-top: 0.5rem;
    margin-top: 0.6rem;
  }
  .icon { flex: none; display: block; }
  .ink { stroke: oklch(19% 0.012 40); }
  .oxide { stroke: oklch(56% 0.17 45); }
  .oxide-fill { fill: oklch(56% 0.17 45); }
  .ink-fill { fill: oklch(19% 0.012 40); }

  .wm {
    font-family: "Big Shoulders Display", sans-serif;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: -0.03em;
    font-size: 1.9rem;
    color: oklch(19% 0.012 40);
  }
  .o-scan-wrap { position: relative; display: inline-block; clip-path: inset(0); }
  .o-scan-bar {
    position: absolute; left: -10%; right: -10%; height: 12%;
    background: oklch(56% 0.17 45 / 0.9);
    animation: scanY 2.4s cubic-bezier(0.65,0,0.35,1) infinite alternate;
  }
  @keyframes scanY { 0% { top: 4%; } 100% { top: 82%; } }
  @media (prefers-reduced-motion: reduce) { .o-scan-bar { animation-duration: 0.001ms; } }
</style>
</head>
<body>
  <div class="grid">

    <!-- 1. Triple orbit (three daily circuits) -->
    <div class="card" id="r1">
      <div class="card__mark">
        <svg class="icon" width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="20" cy="20" r="3" class="ink-fill"/>
          <circle cx="20" cy="20" r="9" class="ink" stroke-width="1.4" opacity="0.5"/>
          <circle cx="20" cy="20" r="15" class="ink" stroke-width="1.4" opacity="0.3"/>
          <circle cx="35" cy="20" r="2.2" class="oxide-fill"/>
        </svg>
        <div class="wm">TAL<span class="o-scan-wrap">O<span class="o-scan-bar"></span></span>S</div>
      </div>
      <div class="card__label">1 — Triple orbit (patrol cadence)</div>
    </div>

    <!-- 2. Anomaly waveform -->
    <div class="card" id="r2">
      <div class="card__mark">
        <svg class="icon" width="46" height="30" viewBox="0 0 46 30" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M1 20 H12 L16 20 L19 8 L23 26 L27 20 H34" class="ink" stroke-width="2" stroke-linejoin="round"/>
          <path d="M34 20 H45" class="ink" stroke-width="2"/>
          <circle cx="23" cy="26" r="2.2" class="oxide-fill"/>
        </svg>
        <div class="wm">TAL<span class="o-scan-wrap">O<span class="o-scan-bar"></span></span>S</div>
      </div>
      <div class="card__label">2 — Anomaly waveform</div>
    </div>

    <!-- 3. Heel mark (literal vulnerability) -->
    <div class="card" id="r3">
      <div class="card__mark">
        <svg class="icon" width="34" height="34" viewBox="0 0 34 34" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M6 30 C6 22 6 14 12 8 C16 4 22 4 26 8 L26 22 C26 26 22 30 16 30 Z" class="ink" stroke-width="2"/>
          <circle cx="9" cy="27" r="2.4" class="oxide-fill"/>
        </svg>
        <div class="wm">TAL<span class="o-scan-wrap">O<span class="o-scan-bar"></span></span>S</div>
      </div>
      <div class="card__label">3 — Heel mark (the vulnerable point)</div>
    </div>

    <!-- 4. Gear tooth fragment -->
    <div class="card" id="r4">
      <div class="card__mark">
        <svg class="icon" width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="20" cy="20" r="12" class="ink" stroke-width="2"/>
          <path d="M20 8 L23 2 L17 2 Z" class="ink-fill"/>
          <path d="M32 20 L38 20" class="ink" stroke-width="2"/>
          <path d="M20 32 L17 38 L23 38 Z" class="ink-fill"/>
          <path d="M8 20 L2 20" class="ink" stroke-width="2"/>
          <path d="M20 8 L23 2 L17 2 Z" class="oxide-fill" transform="rotate(90 20 20)"/>
        </svg>
        <div class="wm">TAL<span class="o-scan-wrap">O<span class="o-scan-bar"></span></span>S</div>
      </div>
      <div class="card__label">4 — Gear, one tooth marked</div>
    </div>

    <!-- 5. Seal / bolt -->
    <div class="card" id="r5">
      <div class="card__mark">
        <svg class="icon" width="36" height="36" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
          <polygon points="18,2 31,9.5 31,24.5 18,32 5,24.5 5,9.5" class="ink" stroke-width="2"/>
          <circle cx="18" cy="17" r="4" class="oxide-fill"/>
        </svg>
        <div class="wm">TAL<span class="o-scan-wrap">O<span class="o-scan-bar"></span></span>S</div>
      </div>
      <div class="card__label">5 — Seal / bolt head</div>
    </div>

  </div>
</body>
</html>
